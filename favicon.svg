<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 棋盤深色漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1d" />
      <stop offset="100%" stop-color="#14182e" />
    </linearGradient>
    
    <!-- 黑子立體光澤 -->
    <radialGradient id="blackStoneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- 白子立體光澤 -->
    <radialGradient id="whiteStoneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- 霓虹光暈濾鏡 -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f2fe" flood-opacity="0.9" />
    </filter>
    <filter id="neonPink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff2e63" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. 簡約深色圓角外框 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2a3356" stroke-width="1.5" />

  <!-- 2. 簡約高對比棋盤網格線 -->
  <!-- 橫線 -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#253055" stroke-width="1.2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <line x1="12" y1="44" x2="52" y2="44" stroke="#253055" stroke-width="1.2" stroke-linecap="round" />

  <!-- 直線 -->
  <line x1="20" y1="12" x2="20" y2="52" stroke="#253055" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="12" x2="32" y2="52" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <line x1="44" y1="12" x2="44" y2="52" stroke="#253055" stroke-width="1.2" stroke-linecap="round" />

  <!-- 3. 五子連珠金色/霓虹連線 -->
  <line x1="20" y1="32" x2="48" y2="32" stroke="#00f2fe" stroke-width="2" stroke-dasharray="2 2" opacity="0.6" />

  <!-- 4. 黑子 (左側 - 帶青藍霓虹光環) -->
  <circle cx="22" cy="32" r="9.5" fill="none" stroke="#00f2fe" stroke-width="1.8" filter="url(#neonCyan)" />
  <circle cx="22" cy="32" r="8.5" fill="url(#blackStoneGrad)" stroke="#00f2fe" stroke-width="1" />
  
  <!-- 5. 白子 (右側 - 帶桃紅霓虹光環) -->
  <circle cx="38" cy="32" r="9.5" fill="none" stroke="#ff2e63" stroke-width="1.8" filter="url(#neonPink)" />
  <circle cx="38" cy="32" r="8.5" fill="url(#whiteStoneGrad)" stroke="#ffffff" stroke-width="1" />

  <!-- 6. 五子相連的最後連鎖點 (象徵五子連珠達成) -->
  <circle cx="48" cy="32" r="2.5" fill="#ff2e63" filter="url(#neonPink)" />
</svg>
